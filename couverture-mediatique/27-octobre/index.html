<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Couverture médiatique — Mardi 27 octobre 2026 | Colloque ISAJC × RIA 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#182543;--ink-soft:#586178;--paper:#f7f2e6;--line:rgba(24,37,67,.14);--teal:#1c7d8c;--gold:#c1892c;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;line-height:1.55;}
  header{background:var(--ink);color:#fff;padding:22px 20px;}
  header .in,main{max-width:960px;margin:0 auto;}
  header a{color:#f1d9a6;text-decoration:none;font-size:14px;font-weight:600;}
  header h1{font-family:'Fraunces',serif;font-size:28px;margin:10px 0 2px;}
  header p{margin:0;color:#cfd6e6;font-size:14px;}
  main{padding:28px 20px 60px;}
  .empty{background:#fff;border:1px dashed var(--gold);border-radius:14px;padding:28px;color:var(--ink-soft);}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:18px;}
  .grid{grid-template-columns:repeat(auto-fill,minmax(240px,300px));}
  .grid a,.grid figure{display:block;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0;text-decoration:none;color:inherit;}
  .grid img{width:100%;height:auto;aspect-ratio:909/1281;object-fit:cover;display:block;}
  .grid figcaption,.grid a span{display:block;padding:10px 12px;font-size:13.5px;}
</style>
</head>
